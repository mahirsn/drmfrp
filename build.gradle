plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    // 26.1+ ships unobfuscated with official Mojang names, so no `mappings`
    // entry and nothing to remap against.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Loom 1.17+ detects mod jars on its own, so no modImplementation.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Only for the settings screen it shows; drmfrp runs without Mod Menu.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
    // The target versions come from gradle.properties, so one source builds
    // for 26.2 and for 26.3 (-Pminecraft_version=26.3 ...) without hand edits.
    def props = [version: project.version, minecraft_version: project.minecraft_version,
                 loader_version: project.loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
